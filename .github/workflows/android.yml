name: Build WalkLearn APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Prepare Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.37

      # Keep the same debug signing key across runs so a freshly-built
      # APK never conflicts with one already installed on a test device.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Ensure a debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          . .venv/bin/activate
          set +e
          set +o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer_full.log
          buildozer_status=${PIPESTATUS[1]}
          set -e
          if [ "$buildozer_status" -ne 0 ]; then
            echo "❌ buildozer itself exited with status $buildozer_status"
            exit "$buildozer_status"
          fi
          echo "✅ buildozer exited successfully"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer_full.log
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WalkLearn-APK
          path: bin/*.apk
          if-no-files-found: error
